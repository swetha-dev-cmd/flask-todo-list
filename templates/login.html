<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e57c2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h1 {
            color: #1e3c72;
            margin-bottom: 8px;
            font-size: 1.9rem;
        }
        .login-box p.subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            transition: 0.3s;
        }
        .login-box input:focus {
            border-color: #6366f1;
            background: white;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .login-box button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .login-box .link {
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }
        .login-box .link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }
        .error-msg {
            color: #ef4444;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your To-Do List</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="error-msg">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p class="link">
            Don't have an account? <a href="/register">Register here</a>
        </p>
    </div>
</body>
</html>
